# Logo carousel — tools displayed on the home page.
#
# slug:  SimpleIcons slug (https://simpleicons.org). Icons are baked into
#        public/tech/*.svg at build time by scripts/build-tech-icons.mjs.
#        A slug simple-icons doesn't carry (e.g. java, pulled over Oracle's
#        trademark) falls back to a text pill in the carousel.
# color: hex without the # — pick something visible on a dark background.
#
# Keep this list to things actually built with. Daily-driver apps, browsers
# and OS entries were deliberately removed — they padded the bar without
# saying anything about the work.
#
# Two slugs may not repeat: one file is written per slug, so a second entry
# reusing a slug renders an identical icon (and its colour is ignored).

